<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Drum Kit</title>
  
  <link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet">
  <!-- BOOTSRAP LINK  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS LINK -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1 id="title">Drum 🥁 Kit</h1>

  <div class="row justify-content-center">

    <div class="col-6 col-md-4 col-lg-3 text-center">
    <button id="first" class="w drum">w</button>
      </div>
    <div class="col-6 col-md-4 col-lg-3 text-center">
    <button id="second" class="a drum">a</button>
    </div>
    <div class="col-6 col-md-4 col-lg-3 text-center">
    <button id="third" class="s drum">s</button>
    </div>
    <div class="col-6 col-md-4 col-lg-3 text-center">
    <button id="fourth" class="d drum">d</button>
    </div>
    <div class="col-6 col-md-4 col-lg-3 text-center">
    <button id="fiveth" class="j drum">j</button>
    </div>
    <div class="col-6 col-md-4 col-lg-3 text-center">
    <button id="sixth" class="k drum">k</button>
    </div>
    <div class="col-6 col-md-4 col-lg-3 text-center">
    <button id="seventh" class="l drum">l</button>
  </div>

  </div>
  

  <footer class="text-center mt-5">
    Made with ❤️ in London.
  </footer>

  <script type="text/javascript" src="index.js"></script>

</html>
